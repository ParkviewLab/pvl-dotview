name: Release

# Assembled from the ParkviewLab handbook's release parts, one for each of this
# repository's publish targets: the gate, then the job of each target, then the
# job that creates the GitHub Release. The recipe is in the handbook's ci.md.
#
# pvl-dotview's slot: no changelog job and no GitHub Release. This repository
# keeps no CHANGELOG.md and has never published a Release; the workflow ends
# once the pypi job has run.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # full history + all tags: the ancestor and monotonic checks below

      # The repository's one version file, read in `git bump`'s order.
      - name: Verify tag matches the version file
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ -f pyproject.toml ]; then
            FILE=pyproject.toml
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          elif [ -f package.json ]; then
            FILE=package.json
            VERSION=$(jq -r .version package.json)
          elif [ -f VERSION.txt ]; then
            FILE=VERSION.txt
            VERSION=$(tr -d '[:space:]' < VERSION.txt)
          else
            echo "no version file: expected pyproject.toml, package.json or VERSION.txt"
            exit 1
          fi
          # A dev version is never released: the promotion carries develop's
          # placeholder onto main, and `git bump release` drops it before the tag.
          case "$VERSION" in
            *.dev[0-9]*|*-dev[0-9]*)
              echo "::error::$FILE version '$VERSION' is a dev version; finalize the cycle with git bump release before tagging"; exit 1 ;;
          esac
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG != $FILE $VERSION"
            exit 1
          fi

      - name: Verify tag is reachable from origin/main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tagged commit $GITHUB_SHA is not on origin/main"
            echo "release tags must come from main — back-merge through, then re-tag from main"
            exit 1
          fi

      - name: Verify version is greater than the previous release tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV=$(git tag --list 'v*' | grep -vxF "$TAG" | sort -V | tail -n 1 || true)
          if [ -z "$PREV" ]; then
            echo "no previous v* tag — first release, nothing to compare"
            exit 0
          fi
          if [ "$(printf '%s\n' "$PREV" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
            echo "tag $TAG is not greater than the previous release tag $PREV"
            echo "versions only ever increase — bump past $PREV, then re-tag from main"
            exit 1
          fi

  pypi:
    needs: gate
    runs-on: ubuntu-latest
    environment: pypi   # matches the trusted-publisher config on PyPI
    permissions:
      contents: read
      id-token: write       # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
