# What this repository publishes, and where it differs from the handbook's
# release parts (dev-tools' assemble-workflows --check; see the handbook's ci.md).
targets = ["pypi"]

# pvl-dotview's slot, kept by the ruling of 2026-09-26: no changelog job and no
# GitHub Release; the workflow ends once the pypi job has run. The comment at the
# head of release.yml states it.
[[slots]]
job = "the head"
reason = "the comment stating the slot: no changelog job and no GitHub Release"

# The omitted changelog job is reported against the pypi job, which precedes it.
[[slots]]
job = "pypi"
reason = "the changelog job omitted by the slot, reported against the job before it"
